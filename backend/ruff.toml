line-length = 120
target-version = "py312"
# The shared core and Safarnama live outside backend/ but are first-party code of this monorepo.
src = [".", "../packages/py-core/src", "../products/safarnama/api/src"]

[lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # asserts are fine in tests

[lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# Regex tables and user-facing sentence templates read better unwrapped.
"app/keeper/parser.py" = ["E501"]
"app/keeper/agent.py" = ["E501"]
"app/keeper/tools.py" = ["E501"]
"app/evals.py" = ["E501"]  # labelled datasets read better one case per line
"app/products/*.py" = ["E501"]

[lint.isort]
known-first-party = ["app", "appcore", "safarnama", "tests"]
