# The reviewer agent for Tara's proposals: Claude Code (on the owner's subscription) checks each tara/proposals pull
# request against the request in its description and the repository's structure, and posts one review comment.
# Advisory: CI is the hard gate and the owner's approval is the decision.
#
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
name: Tara review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: tara-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.head_ref == 'tara/proposals'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "*" # the proposal is pushed by the Tara bot; this job only runs for tara/proposals
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Its description
            holds the owner's original request. Read it with `gh pr view`, the change with `gh pr diff`, and the
            surrounding code. Check, in this order:
            1. Does the change do what was asked, and nothing unrelated?
            2. Does it follow the repository's existing structure, naming, style and patterns?
            3. Bugs, security problems, accessibility regressions, and missing or weak tests.
            Then post ONE comment with `gh pr comment` that starts with "Verdict: looks right" or
            "Verdict: needs changes", followed by specific findings (file and line). Do not edit any files.
          claude_args: --max-turns 25 --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
