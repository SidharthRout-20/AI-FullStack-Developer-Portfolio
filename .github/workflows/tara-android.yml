# Builds Tara's Android app (a Trusted Web Activity around /keeper) and uploads the signed APK as a run artifact.
# Install it on a phone: open the run on GitHub, download "tara-android", unzip, open the .apk, allow "install
# unknown apps" for your browser or Files app. Free: no store account, a few Actions minutes per build.
#
# Needs two repository secrets (see android/README.md): TARA_ANDROID_KEYSTORE (the keystore, base64) and
# TARA_ANDROID_KEY_PASSWORD. Its fingerprint must match frontend/public/.well-known/assetlinks.json on the live site,
# or the app still works but shows a thin browser bar at the top.
name: Tara Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/tara-android.yml"

permissions:
  contents: read

concurrency:
  group: tara-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.TARA_ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the TARA_ANDROID_KEYSTORE and TARA_ANDROID_KEY_PASSWORD secrets (see android/README.md)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tara.p12"
          echo "TARA_KEYSTORE_PATH=$RUNNER_TEMP/tara.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: android
        env:
          TARA_KEY_PASSWORD: ${{ secrets.TARA_ANDROID_KEY_PASSWORD }}
          TARA_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check the signature matches the site
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          WANT=$(grep -o '"[0-9A-F:]\{95\}"' frontend/public/.well-known/assetlinks.json | tr -d '":' | tr 'A-F' 'a-f')
          GOT=$(grep -i 'SHA-256 digest' certs.txt | head -1 | awk '{print $NF}')
          if [ "$WANT" != "$GOT" ]; then
            echo "::warning::The APK's key ($GOT) is not the one in assetlinks.json ($WANT): the app will show a browser bar."
          fi
          cp "$APK" "tara-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tara-android
          path: tara-${{ github.run_number }}.apk
          retention-days: 30
