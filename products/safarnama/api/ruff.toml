line-length = 120
target-version = "py312"
src = ["src", "../../../packages/py-core/src"]

[lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # asserts are fine in tests

[lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# Prompt texts and user-facing sentence templates read better unwrapped.
"src/safarnama/*.py" = ["E501"]

[lint.isort]
known-first-party = ["appcore", "safarnama", "tests"]
